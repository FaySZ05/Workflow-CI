name: CI MLflow
on:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true # Downloads your 375MB bitcoinhistoricaldata_raw.csv

      - name: Set up Python 3.12.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.13"

      - name: Install dependencies from your conda.yaml
        run: |
          python -m pip install --upgrade pip==24.1.2
          # Installing the specific versions from your conda.yaml
          pip install mlflow==3.11.1 tensorflow==2.19.0 numpy==2.0.2 cloudpickle==3.1.2

      - name: Run MLflow Project
        run: mlflow run ./MLProject --no-conda
