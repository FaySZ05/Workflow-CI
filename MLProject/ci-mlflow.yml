name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  CSV_URL: "MLProject/bitcoinhistoricaldata_raw.csv"
  DOCKER_IMAGE_NAME: "cc"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Use v4 and LFS for my dataset
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      # 2. Setup Python 
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
      
      # 3. Install specific dependencies
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.1.2
          pip install mlflow==3.11.1 tensorflow==2.19.0 numpy==2.0.2 cloudpickle==3.1.2 pandas scikit-learn

      # 4. Run MLflow Project pointing to your folder
      - name: Run MLflow Project
        run: |
          export MLFLOW_TRACKING_URI=sqlite:///mlflow.db
          mlflow run ./MLProject --env-manager=local
      
      # 5. Get latest run_id (Assuming default experiment '0')
      - name: Get latest MLflow run_id
        run: |
          RUN_ID=$(ls -td mlruns/0/*/ | head -n 1 | cut -d'/' -f3)
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV
          echo "Latest run_id: $RUN_ID"
