name: CI MLflow
 
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
 
env:
  # Updated path to match your 'preprocessing' folder structure
  CSV_URL: "preprocessing/bitcoinhistoricaldata_raw.csv"
  TARGET_VAR: "quality"
  ALPHA: 0.5
  L1_RATIO: 0.5
  RANDOM_STATE: 42
 
jobs:
  build:
    runs-on: ubuntu-latest
 
    steps:
      # 1. Setting checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      # 2. Set up Python
      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"
 
      # 3. Install mlflow
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install mlflow pandas scikit-learn # Add any libraries needed to launch the project

      # 4. Run MLflow Project
      - name: Run MLflow Project
        mlflow run ./MLProject --no-conda
