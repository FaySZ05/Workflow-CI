name: CI/CD MLflow

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.12.7
        uses: actions/setup-python@v5
        with:
          python-version: "3.12.7"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip==24.1.2
          pip install mlflow==3.11.1 tensorflow==2.19.0 numpy==2.0.2 cloudpickle==3.1.2 pandas scikit-learn

      - name: Run MLflow project
        run: mlflow run ./MLProject --env-manager=local

      - name: Get latest MLflow run id
        run: |
          python <<'PY'
          import os
          from mlflow.tracking import MlflowClient

          db_path = os.path.join(os.getcwd(), "MLProject", "mlruns", "mlflow.db")
          if not os.path.isfile(db_path):
              raise SystemExit(f"MLflow database not found at {db_path}")
          uri = "sqlite:///" + db_path.replace(os.sep, "/")
          client = MlflowClient(tracking_uri=uri)
          exp = client.get_experiment_by_name("Bitcoin Price Prediction")
          if exp is None:
              raise SystemExit("Experiment 'Bitcoin Price Prediction' not found")
          runs = client.search_runs([exp.experiment_id], max_results=500)
          if not runs:
              raise SystemExit("No runs found in experiment")
          latest = max(runs, key=lambda r: r.info.start_time)
          run_id = latest.info.run_id
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as f:
              f.write(f"RUN_ID={run_id}\n")
          print(f"Latest run_id: {run_id}")
          PY
